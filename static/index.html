<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes · Russel demo</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --fg:#1d1d1f; --muted:#6b6b70; --line:#e4e2dd; --accent:#d9480f; --ok:#2b8a3e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --card:#1e1e22; --fg:#ececef; --muted:#9a9aa2; --line:#2d2d33; --accent:#ff7a3d; --ok:#51cf66; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:40px 16px 64px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  h1 { margin:0; font-size:28px; letter-spacing:-0.02em; }
  h1 span { color:var(--accent); }
  .status { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .dot.up { background:var(--ok); }
  .meta { margin:8px 0 28px; color:var(--muted); font-size:14px; }
  .meta code { font-size:13px; background:var(--card); border:1px solid var(--line); padding:1px 6px; border-radius:6px; }
  form { display:flex; gap:8px; margin-bottom:20px; }
  input { flex:1; min-width:0; font:inherit; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent; }
  button { font:inherit; font-weight:600; padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  li { display:flex; align-items:flex-start; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  li .text { flex:1; word-break:break-word; }
  li time { display:block; font-size:12px; color:var(--muted); margin-top:2px; }
  li .del { background:none; color:var(--muted); padding:2px 6px; font-weight:400; font-size:18px; line-height:1; }
  li .del:hover { color:var(--accent); }
  .empty { text-align:center; color:var(--muted); padding:40px 0; border:1px dashed var(--line); border-radius:12px; }
  footer { margin-top:32px; font-size:13px; color:var(--muted); }
  footer a { color:inherit; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Notes<span>.</span></h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">checking…</span></div>
  </header>
  <p class="meta" id="meta">Deployed with Russel</p>

  <form id="form">
    <input id="text" placeholder="Write a note…" maxlength="500" autocomplete="off" autofocus>
    <button type="submit">Add</button>
  </form>

  <ul id="list"></ul>

  <footer>Stored in <code id="storage">…</code>. JSON API: <a href="/api/info">/api/info</a> · <a href="/notes">/notes</a> · <a href="/health">/health</a></footer>
</main>
<script>
const $ = (id) => document.getElementById(id);

async function info() {
  try {
    const r = await fetch('/api/info');
    const d = await r.json();
    $('dot').className = 'dot up';
    $('status').textContent = 'up ' + d.uptime;
    $('meta').innerHTML = '';
    $('meta').append(d.message + ' · container ', Object.assign(document.createElement('code'), { textContent: d.hostname }));
    $('storage').textContent = d.storage;
  } catch {
    $('dot').className = 'dot';
    $('status').textContent = 'unreachable';
  }
}

async function load() {
  const notes = await (await fetch('/notes')).json();
  const list = $('list');
  list.innerHTML = '';
  if (!notes.length) {
    list.innerHTML = '<div class="empty">No notes yet. Add one above.</div>';
    return;
  }
  for (const n of notes.reverse()) {
    const li = document.createElement('li');
    const body = document.createElement('div');
    body.className = 'text';
    body.textContent = n.text;
    const t = document.createElement('time');
    t.textContent = new Date(n.created_at).toLocaleString();
    body.append(t);
    const del = document.createElement('button');
    del.className = 'del';
    del.title = 'Delete';
    del.textContent = '×';
    del.onclick = async () => { await fetch('/notes/' + n.id, { method: 'DELETE' }); load(); };
    li.append(body, del);
    list.append(li);
  }
}

$('form').onsubmit = async (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text) return;
  await fetch('/notes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
  $('text').value = '';
  load();
};

info(); load();
setInterval(info, 5000);
</script>
</body>
</html>
